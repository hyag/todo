<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToDo — タスク管理</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --accent:        #6366f1;
  --accent-strong: #4f46e5;
  --accent-soft:   rgba(99,102,241,.10);
  --bg:            #f8fafc;
  --bg-elevated:   #ffffff;
  --border:        #e2e8f0;
  --text:          #0f172a;
  --text-muted:    #64748b;
  --radius:        12px;
  --shadow:        0 1px 3px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --maxw:          680px;
  --high:   #ef4444;
  --medium: #f59e0b;
  --low:    #22c55e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent:        #818cf8;
    --accent-strong: #a5b4fc;
    --accent-soft:   rgba(129,140,248,.12);
    --bg:            #0a0f1e;
    --bg-elevated:   #111827;
    --border:        #1e2d45;
    --text:          #f1f5f9;
    --text-muted:    #94a3b8;
    --shadow:        0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI",
               "Noto Sans JP", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

.wrap {
  width: min(100% - 2.5rem, var(--maxw));
  margin: 0 auto;
  padding: clamp(2rem, 8vw, 4rem) 0 4rem;
}

/* ヘッダー */
.header { margin-bottom: 2rem; }
.header h1 {
  margin: 0 0 .3rem;
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 700;
  letter-spacing: -.02em;
}
.header p { margin: 0; color: var(--text-muted); font-size: .9rem; }

/* 入力フォーム */
.form {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
}
.form-row { display: flex; gap: .6rem; flex-wrap: wrap; }
.form input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: .6rem .9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.form input[type="text"]:focus { border-color: var(--accent); }
.form input[type="date"],
.form input[type="time"] {
  padding: .6rem .9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: .88rem;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.form input[type="date"]:focus,
.form input[type="time"]:focus { border-color: var(--accent); }
.form select {
  padding: .6rem .9rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: .88rem;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color .2s;
}
.form select:focus { border-color: var(--accent); }
.btn-add {
  padding: .6rem 1.4rem;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: .92rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background .2s;
}
.btn-add:hover { background: var(--accent-strong); }

/* フィルター */
.filters {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.filter-btn {
  padding: .3rem .9rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--text-muted);
  font-size: .82rem;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s;
}
.filter-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

/* タスクリスト */
.task-list { display: flex; flex-direction: column; gap: .6rem; }

.task-item {
  display: flex;
  align-items: flex-start;
  gap: .8rem;
  padding: 1rem 1.1rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: opacity .2s;
}
.task-item.priority-high   { border-left-color: var(--high); }
.task-item.priority-medium { border-left-color: var(--medium); }
.task-item.priority-low    { border-left-color: var(--low); }
.task-item.done { opacity: .5; }

.task-check {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: .15rem;
  display: grid;
  place-items: center;
  transition: all .2s;
  background: transparent;
}
.task-item.done .task-check {
  background: var(--accent);
  border-color: var(--accent);
}
.task-check::after {
  content: "✓";
  color: #fff;
  font-size: .65rem;
  font-weight: 700;
  opacity: 0;
  transition: opacity .2s;
}
.task-item.done .task-check::after { opacity: 1; }

.task-body { flex: 1; min-width: 0; }
.task-text {
  font-size: .95rem;
  font-weight: 500;
  margin: 0 0 .3rem;
  word-break: break-word;
}
.task-item.done .task-text { text-decoration: line-through; }
.task-meta {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
}
.priority-badge {
  font-size: .72rem;
  font-weight: 700;
  padding: .1rem .55rem;
  border-radius: 999px;
}
.priority-badge.high   { background: rgba(239,68,68,.12);  color: var(--high); }
.priority-badge.medium { background: rgba(245,158,11,.12); color: var(--medium); }
.priority-badge.low    { background: rgba(34,197,94,.12);  color: var(--low); }

.due-date {
  font-size: .78rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: .25rem;
}
.due-date.overdue { color: var(--high); font-weight: 600; }

.btn-delete {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
  padding: .1rem;
  flex-shrink: 0;
  opacity: .5;
  transition: opacity .2s, color .2s;
}
.btn-delete:hover { opacity: 1; color: var(--high); }

/* 空状態 */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
  font-size: .9rem;
}
.empty-icon { font-size: 2.5rem; margin-bottom: .6rem; }

/* カウント */
.count {
  font-size: .82rem;
  color: var(--text-muted);
  margin-bottom: .75rem;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>📋 ToDo</h1>
    <p>タスクを管理して、毎日をすっきりさせよう。</p>
  </div>

  <!-- 入力フォーム -->
  <div class="form">
    <input type="text" id="taskInput" placeholder="タスクを入力..." maxlength="100">
    <div class="form-row">
      <select id="prioritySelect">
        <option value="medium">優先度：中</option>
        <option value="high">優先度：高</option>
        <option value="low">優先度：低</option>
      </select>
      <input type="date" id="dueDateInput">
      <input type="time" id="dueTimeInput" title="期限の時刻（任意）">
      <button class="btn-add" id="addBtn">追加</button>
    </div>
  </div>

  <!-- フィルター -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="active">未完了</button>
    <button class="filter-btn" data-filter="done">完了済み</button>
    <button class="filter-btn" data-filter="high">優先度：高</button>
    <button class="filter-btn" data-filter="overdue">期限切れ</button>
  </div>

  <div class="count" id="count"></div>
  <div class="task-list" id="taskList"></div>

</div>

<script>
const STORAGE_KEY = 'heroworks_todo_v1';
let tasks = [];
let currentFilter = 'all';

// ローカルストレージから読み込み
function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    tasks = saved ? JSON.parse(saved) : [];
  } catch { tasks = []; }
}

// ローカルストレージへ保存
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
}

// 期限入力の読み取り（日付のみ: "YYYY-MM-DD"、時刻あり: "YYYY-MM-DDTHH:MM"）
function readDue() {
  const date = document.getElementById('dueDateInput').value;
  const time = document.getElementById('dueTimeInput').value;
  if (!date) return '';
  return time ? `${date}T${time}` : date;
}

// 期限の日時（日付のみの場合はその日の終わり）
function dueDate(due) {
  if (due.includes('T')) return new Date(due);
  const [y, m, d] = due.split('-').map(Number);
  return new Date(y, m - 1, d, 23, 59, 59, 999);
}

function isOverdue(t) {
  return !!t.due && !t.done && dueDate(t.due) < new Date();
}

// タスク追加
function addTask() {
  const text = document.getElementById('taskInput').value.trim();
  if (!text) return;
  tasks.unshift({
    id: Date.now(),
    text,
    priority: document.getElementById('prioritySelect').value,
    due: readDue(),
    done: false,
    createdAt: new Date().toISOString()
  });
  document.getElementById('taskInput').value = '';
  document.getElementById('dueDateInput').value = '';
  document.getElementById('dueTimeInput').value = '';
  save();
  render();
}

// 完了トグル
function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

// 削除
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
}

// フィルタリング
function filtered() {
  switch (currentFilter) {
    case 'active':  return tasks.filter(t => !t.done);
    case 'done':    return tasks.filter(t => t.done);
    case 'high':    return tasks.filter(t => t.priority === 'high');
    case 'overdue': return tasks.filter(isOverdue);
    default:        return tasks;
  }
}

// 期限表示
function dueLabel(t) {
  if (!t.due) return '';
  const d = dueDate(t.due);
  const label = t.due.includes('T')
    ? `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
    : `${d.getMonth()+1}/${d.getDate()}`;
  const overdue = isOverdue(t);
  return `<span class="due-date ${overdue ? 'overdue' : ''}">📅 ${label}${overdue ? ' 期限切れ' : ''}</span>`;
}

// 描画
function render() {
  const list = filtered();
  const el = document.getElementById('taskList');
  const countEl = document.getElementById('count');
  const active = tasks.filter(t => !t.done).length;
  countEl.textContent = `未完了 ${active} 件 / 全 ${tasks.length} 件`;

  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✨</div>タスクがありません</div>`;
    return;
  }

  el.innerHTML = list.map(t => `
    <div class="task-item priority-${t.priority} ${t.done ? 'done' : ''}" data-id="${t.id}">
      <div class="task-check" onclick="toggleDone(${t.id})"></div>
      <div class="task-body">
        <p class="task-text">${escHtml(t.text)}</p>
        <div class="task-meta">
          <span class="priority-badge ${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]}</span>
          ${dueLabel(t)}
        </div>
      </div>
      <button class="btn-delete" onclick="deleteTask(${t.id})" aria-label="削除">✕</button>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// イベント
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

load();
render();
</script>
</body>
</html>
